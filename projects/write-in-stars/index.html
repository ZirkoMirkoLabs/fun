<body>
	<canvas id="sky" aria-label="A galaxy of stars. Move across it to push stars, tap for a shockwave, scroll to zoom."></canvas>

	<h1 class="sr-only">Write in Stars: type anything and watch a galaxy spell it</h1>

	<header class="top">
		<a class="brand" href="https://zirkomirko.com/fun/projects/" aria-label="ZirkoMirko fun projects">
			<img src="zm_logo.webp" alt="ZirkoMirko" width="44" height="37">
			<span class="lab">Write in Stars</span>
		</a>
		<div class="top-tools">
			<button type="button" id="remixOpen" aria-expanded="false" aria-controls="remix">Remix</button>
		</div>
	</header>

	<div class="bottom">
		<form id="form" class="composer" autocomplete="off">
			<input id="imageFile" type="file" accept="image/*" class="sr-only" tabindex="-1" aria-label="Choose an image">
			<button type="button" id="imageBtn" class="img-btn" aria-label="Use an image" title="Use an image">
				<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.7" fill="currentColor"/><path d="M4 17.5l5-4.8 3.6 3.3 2.6-2.3L20 17.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
				<span class="img-label">Image</span>
			</button>
			<label for="text" class="sr-only">Type anything</label>
			<input id="text" name="t" maxlength="28" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Type anything…" enterkeyhint="go">
			<button type="submit" class="primary">Write</button>
		</form>
		<div class="row">
			<div class="chips">
				<button type="button" id="toggle">Galaxy</button>
				<button type="button" id="random">Surprise me</button>
			</div>
			<nav class="actions" aria-label="Share">
				<button type="button" id="saveClip"><span class="long">Save </span>clip</button>
				<button type="button" id="saveCard"><span class="long">Save image</span><span class="short">PNG</span></button>
				<button type="button" id="copyLink"><span class="long">Copy </span>link</button>
				<a id="post" href="https://x.com/intent/post" target="_blank" rel="noopener">Post</a>
			</nav>
		</div>
		<p id="hint" class="hint" role="status">Type anything, or tap the image button to use a picture</p>
	</div>

	<section id="remix" hidden aria-labelledby="remixTitle">
		<header><h2 id="remixTitle" class="serif">Remix</h2><button type="button" id="remixClose" aria-label="Close remix">×</button></header>
		<label class="control">Palette<select id="palette"></select></label>
		<div id="sliders"></div>
		<label class="pause"><input id="pause" type="checkbox"> Pause motion</label>
		<button type="button" id="reset">Reset look</button>
	</section>

	<div id="drop" hidden><p class="serif">Drop it to turn it into stars</p><p class="lab">Stays on your device</p></div>

	<p id="status" class="lab" role="status">Gathering stars…</p>

	<dialog id="dlg" aria-labelledby="dlgTitle">
		<div class="dlg-head">
			<h2 class="serif" id="dlgTitle">Your image</h2>
			<button type="button" class="x" id="dlgClose" aria-label="Close">×</button>
		</div>
		<div id="dlgMedia" class="media"></div>
		<p id="dlgHint" class="lab"></p>
		<div class="dlg-actions">
			<a id="dlgDownload" class="primary" download>Download</a>
			<button type="button" id="dlgShare" hidden>Share…</button>
			<a id="dlgPost" href="https://x.com/intent/post" target="_blank" rel="noopener">Post on X</a>
		</div>
	</dialog>

	<script type="module" src="boot.js"></script>
</body>
